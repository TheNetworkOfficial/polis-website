<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Return to Polis after text banking billing."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Return to Polis</title>
  </head>
  <body>
    <main class="text-banking-return" aria-labelledby="return-title">
      <section class="text-banking-return__card">
        <div class="text-banking-return__brand" aria-label="Polis">Polis</div>
        <div class="text-banking-return__status" aria-hidden="true">
          &#8592;
        </div>
        <p class="text-banking-return__eyebrow" data-return-eyebrow>
          Text banking
        </p>
        <h1 id="return-title" data-return-title>Return to Polis</h1>
        <p class="text-banking-return__message" data-return-message>
          Switch back to the Polis app to continue.
        </p>
        <p class="text-banking-return__note" data-return-note>
          Your verified status in Polis remains the source of truth.
        </p>
        <p class="text-banking-return__hint">
          You can safely close this browser tab.
        </p>
      </section>
    </main>
  </body>
</html>
